name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:

env:
  ACTIONS_STEP_DEBUG: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate script syntax
        run: |
          if ! bash -n status-check.sh; then
            echo "::error::Erro na sintaxe do script status-check.sh"
            exit 1
          fi
          echo "::warning::Script syntax validated"

  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Run tests simulation
        run: |
          echo "Running tests"
          echo "::warning::Simulação de teste executada com sucesso"

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Generate report artifact
        run: |
          zip report.zip *.sh || echo "::error::Falha ao criar o artefato report.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: report
          path: report.zip

  summary:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Create job summary
        run: |
          echo "## Resumo do Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "- Ambiente: $RUNNER_OS" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: $GITHUB_REF_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- Resultado do validate: ${{ needs.validate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Resultado do test: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Resultado do package: ${{ needs.package.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Artefato: [report.zip](${{ steps.upload-artifact.outputs.artifact_url }})" >> $GITHUB_STEP_SUMMARY
