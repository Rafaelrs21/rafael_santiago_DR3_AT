name: Diagnostic Check

on:
  workflow_dispatch:

jobs:
  diagnostics:
    name: Verificar variáveis obrigatórias
    runs-on: ubuntu-latest
    env:
      APP_ENV: ${{ vars.APP_ENV }}
      API_KEY: ${{ secrets.API_KEY }}
    steps:
      - name: Verificar variáveis
        run: |
          echo "Iniciando verificação de variáveis..."
          
          if [ -z "$APP_ENV" ]; then
            echo "::error::APP_ENV não está definida."
            APP_ENV_STATUS=" Ausente"
            FAIL=true
          else
            echo "::notice::APP_ENV = $APP_ENV"
            APP_ENV_STATUS=" $APP_ENV"
          fi
          
          if [ -z "$API_KEY" ]; then
            echo "::error::API_KEY não está definida."
            API_KEY_STATUS=" Ausente"
            FAIL=true
          else
            echo "::notice::API_KEY está definida (oculta nos logs)"
            API_KEY_STATUS=" Definida"
          fi
          
          # Resumo
          echo "## 🩺 Diagnóstico do Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "- APP_ENV: $APP_ENV_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "- API_KEY: $API_KEY_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Sugestões" >> $GITHUB_STEP_SUMMARY
          echo "- Defina APP_ENV em **Settings > Variables** se estiver ausente." >> $GITHUB_STEP_SUMMARY
          echo "- Defina API_KEY em **Settings > Secrets** se necessário." >> $GITHUB_STEP_SUMMARY
          echo "- Reexecute este workflow após corrigir os problemas." >> $GITHUB_STEP_SUMMARY

          # Falhar se necessário
          if [ "$FAIL" = true ]; then
            exit 1
          fi